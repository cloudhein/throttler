name: Throttler Microservices CI
on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
      
      - name: Install dependency
        run: |
          go mod download

      - name: Cache Go modules
        id: cache-go-modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-        
        
      - name: Build
        run: |
          cd cmd/api
          go build -o throttler .

      - name: unit tests
        run: |
          cd cmd/api
          go test 

  code-quality:
    runs-on: runner-scaleset-01
    needs: [build]
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"

      - name: Restore Go modules cache
        id: cache-go-modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-  

      - name: Install dependencies
        if: steps.cache-go-modules.outputs.cache-hit != 'true'
        run: |
          go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8 
        with:
          version: v2.1
          args: golangci-lint run
          working-directory: cmd/api
        continue-on-error: true

  container:
    runs-on: ubuntu-latest
    needs: [build, code-quality]

    steps:
      - name: checkout code
        uses: actions/checkout@v4
  
      - name: Set up Docker Buildx
        uses: docker/setup-docker-action@v4

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (local only)
        run: |
          docker build -t "${{ vars.DOCKERHUB_USERNAME }}/throttler:${{ github.run_id }}" .

      - name: Scan image in a private registry
        id: trivy-scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/throttler:${{ github.run_id }}'
          scan-type: image
          severity: 'CRITICAL'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Push Docker images
        # Only push if the scan was successful
        if: steps.trivy-scan.outcome == 'success'
        run: docker push "${{ vars.DOCKERHUB_USERNAME }}/throttler:${{ github.run_id }}"

